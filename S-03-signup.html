<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYT.ESG — Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F6F2; --surface:#FFFFFF; --border:#E2E0D8;
    --text:#1A1917; --text-muted:#6B6860; --text-light:#9B9890;
    --accent:#2D5F3F; --accent-light:#E6F0EA; --accent-mid:#B8D5C4;
    --green:#1A7A4A; --red:#B91C1C; --red-light:#FEE2E2;
    --radius:10px; --radius-sm:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  .topnav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; height:52px; display:flex; align-items:center; }
  .logo { font-size:15px; font-weight:600; letter-spacing:-0.3px; color:var(--text); text-decoration:none; }
  .logo span { color:var(--accent); }
  .auth-wrap { max-width:420px; margin:0 auto; padding:52px 24px 80px; flex:1; }
  .auth-eyebrow { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent); margin-bottom:8px; }
  .auth-title { font-size:22px; font-weight:700; letter-spacing:-0.4px; margin-bottom:6px; }
  .auth-sub { font-size:14px; color:var(--text-muted); margin-bottom:28px; }
  .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12.5px; font-weight:500; margin-bottom:5px; }
  .field input {
    width:100%; height:40px; padding:0 12px;
    border:1px solid var(--border); border-radius:var(--radius-sm);
    font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text);
    background:var(--surface); outline:none;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(45,95,63,0.1); }
  .field-hint { font-size:11.5px; color:var(--text-light); margin-top:4px; }
  .btn-submit {
    width:100%; height:42px; background:var(--accent); color:white;
    border:none; border-radius:var(--radius-sm); font-family:'DM Sans',sans-serif;
    font-size:14.5px; font-weight:500; cursor:pointer; transition:filter 0.15s; margin-top:4px;
  }
  .btn-submit:hover { filter:brightness(1.1); }
  .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }
  .error-box { background:var(--red-light); border:1px solid #FCA5A5; border-radius:var(--radius-sm); padding:10px 13px; font-size:13px; color:var(--red); margin-bottom:14px; display:none; }
  .auth-footer { text-align:center; font-size:13px; color:var(--text-muted); margin-top:18px; }
  .auth-footer a { color:var(--accent); font-weight:500; }
  .skip-link { display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--text-light); cursor:pointer; }
  .skip-link:hover { color:var(--text-muted); }
  .password-strength { height:3px; border-radius:2px; background:var(--border); margin-top:6px; overflow:hidden; }
  .ps-bar { height:100%; border-radius:2px; transition:width 0.3s, background 0.3s; width:0%; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="/index.html" class="logo">ZYT<span>.ESG</span></a>
</nav>

<div class="auth-wrap">
  <div class="auth-eyebrow">Step 2 of 5</div>
  <div class="auth-title">Create your account</div>
  <div class="auth-sub">Free. Your data belongs to you. No credit card required.</div>

  <div class="auth-card">
    <div class="error-box" id="error-box"></div>

    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" placeholder="you@company.com.sg" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters"
             autocomplete="new-password" oninput="checkStrength(this.value)">
      <div class="password-strength"><div class="ps-bar" id="ps-bar"></div></div>
      <div class="field-hint" id="ps-hint">Use 8+ characters</div>
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" placeholder="Repeat your password"
             autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignUp()">
    </div>

    <button class="btn-submit" id="submit-btn" onclick="doSignUp()">Create account →</button>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="/S-05-login.html">Log in →</a>
  </div>
  <div class="skip-link" onclick="skipAuth()">Continue without an account (data saved to this browser only)</div>
</div>

<script type="module">
  import { signUp, saveLocal } from '/js/supabase.js';

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.style.display = 'block';
  }

  window.checkStrength = (pw) => {
    const bar = document.getElementById('ps-bar');
    const hint = document.getElementById('ps-hint');
    if (pw.length === 0) { bar.style.width='0%'; hint.textContent='Use 8+ characters'; return; }
    const score = [pw.length >= 8, /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
    const colors = ['#EF4444','#F97316','#EAB308','#22C55E'];
    const labels = ['Too short','Weak','Good','Strong'];
    bar.style.width = (score * 25) + '%';
    bar.style.background = colors[score - 1] || '#EF4444';
    hint.textContent = labels[score - 1] || 'Too short';
  };

  window.doSignUp = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    document.getElementById('error-box').style.display = 'none';

    if (!email) return showError('Please enter your email address.');
    if (password.length < 8) return showError('Password must be at least 8 characters.');
    if (password !== password2) return showError('Passwords do not match.');

    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Creating account…';
    btn.disabled = true;

    const { data, error } = await signUp(email, password);
    if (error) {
      showError(error.message);
      btn.textContent = 'Create account →';
      btn.disabled = false;
      return;
    }

    saveLocal('zyt_signup_email', email);
    window.location.href = '/S-04-check-email.html';
  };

  window.skipAuth = () => {
    saveLocal('zyt_auth_skipped', true);
    window.location.href = '/S-06-company-profile.html';
  };
</script>
</body>
</html>
